<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"><title>Pipeline: every X archive export loads into SQLite as a dated snapshot with full-text search; FastAPI serves it to a React UI. Optionally, the X API fills in bios and follower counts, and an all-MiniLM-L6-v2 topic tagger labels tweets.</title>
<style>
  .bg{fill:#FAF7F0} .lane{fill:#F2EDE3} .box{fill:#FDFBF6;stroke:#D9D0C1;stroke-width:2}
