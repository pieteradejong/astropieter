<text class="t" x="980.0" y="280" text-anchor="middle">Embeddings</text>
<text class="s" x="980.0" y="316" text-anchor="middle">all-MiniLM-L6-v2</text>
<text class="m" x="980.0" y="388" text-anchor="middle">384 dims</text>
<rect class="hot" x="1210" y="230" width="300" height="176" rx="10"/>
<text class="t" x="1360.0" y="280" text-anchor="middle">ChromaDB</text>
