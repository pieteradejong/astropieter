<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"><title>Pipeline: episode pages are crawled from buffy.fandom.com into a document store of 144 episodes, embedded with all-MiniLM-L6-v2 and indexed in ChromaDB; a question from the React UI goes to FastAPI, is embedded, matched against ChromaDB and returned as ranked episodes.</title>
<style>
  .bg{fill:#FAF7F0} .lane{fill:#F2EDE3} .box{fill:#FDFBF6;stroke:#D9D0C1;stroke-width:2}
  .hot{fill:#FDFBF6;stroke:#C15F3C;stroke-width:3}
  .t{fill:#2B2724;font:600 30px -apple-system,'Helvetica Neue',Arial,sans-serif}
  .s{fill:#6B635B;font:22px -apple-system,'Helvetica Neue',Arial,sans-serif}
  .m{fill:#8F3E23;font:20px ui-monospace,Menlo,monospace}
  .lab{fill:#6B635B;font:600 20px -apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.16em}
  .ttl{fill:#2B2724;font:italic 44px Georgia,'Times New Roman',serif}
  .a{stroke:#8F3E23;stroke-width:3;fill:none} .ah{fill:#8F3E23}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1C1917} .lane{fill:#26221F} .box{fill:#232019;stroke:#3D3833} .hot{fill:#232019;stroke:#E08D6B}
    .t{fill:#EDE6DA} .s,.lab{fill:#A39A8D} .m{fill:#F0AC8E} .ttl{fill:#EDE6DA}
    .a{stroke:#F0AC8E} .ah{fill:#F0AC8E}
  }
</style><rect class="bg" width="1600" height="1000"/><text class="ttl" x="70" y="100">TV Show Chat</text><rect class="lane" x="40" y="150" width="1520" height="330" rx="14"/><text class="lab" x="70" y="190">INGEST · ONCE</text>
<rect class="lane" x="40" y="570" width="1520" height="330" rx="14"/><text class="lab" x="70" y="610">EVERY QUESTION</text>
<rect class="box" x="70" y="230" width="300" height="176" rx="10"/>
<text class="t" x="220.0" y="280" text-anchor="middle">buffy.fandom.com</text>
<text class="s" x="220.0" y="316" text-anchor="middle">episode pages</text>
<rect class="box" x="450" y="230" width="300" height="176" rx="10"/>
<text class="t" x="600.0" y="280" text-anchor="middle">Document store</text>
