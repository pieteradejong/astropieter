<text class="m" x="600.0" y="808" text-anchor="middle">/api/search</text>
<rect class="box" x="830" y="650" width="300" height="176" rx="10"/>
<text class="t" x="980.0" y="700" text-anchor="middle">Nearest episodes</text>
<text class="s" x="980.0" y="736" text-anchor="middle">by similarity</text>
